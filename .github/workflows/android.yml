name: Android build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android 17 SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify release tooling
        run: python3 -m unittest discover -s tools -p 'test_verify_release.py'
      - name: Build and verify
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest assemblePreview testPreviewUnitTest lintPreview
      - uses: actions/upload-artifact@v4
        with:
          name: depthwall-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@v4
        with:
          name: depthwall-preview-and-reports
          path: |
            app/build/outputs/apk/preview/*.apk
            app/build/reports/tests/testPreviewUnitTest/
            app/build/reports/lint-results-preview.html
